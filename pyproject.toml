[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "normalising-flows-coursework"
version = "0.1.0"
description = "Affine coupling flows, density estimation and shear transformations for Cambridge M2 coursework"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Peijing Pang"}]
dependencies = ["numpy>=2.3,<3", "torch>=2.10,<3", "matplotlib>=3.10,<4"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=7,<8"]
dev = ["pytest>=9,<10", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=7,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
